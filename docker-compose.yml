services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dominio_globale
      POSTGRES_USER: dominio
      POSTGRES_PASSWORD: dominio
    ports:
      - "5432:5432"
    volumes:
      - dominio_globale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dominio -d dominio_globale"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dominio_globale_data:
